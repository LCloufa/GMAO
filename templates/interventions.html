{% extends "base.html" %}
{% block content %}

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
    <h1>Gestion des interventions</h1>

    <button class="btn-primary" onclick="openInterventionForm()">
    + Nouvelle intervention
    </button>
</div>

<table>
    <tr>
        <th>Titre</th>
        <th>Type</th>
        <th>Priorité</th>
        <th>Statut</th>
        <th>Date</th>
        <th>Heure</th>
        <th>Équipement</th>
        <th>Technicien</th>
    </tr>

    {% for i in interventions %}
    <tr onclick="openIntervention({{ i[0] }})" style="cursor:pointer;">
        <td>{{ i[1] }}</td>

        <td>
            <span class="badge type-{{ i[2] }}">{{ i[2] }}</span>
        </td>

        <td>
            <span class="badge priority-{{ i[3] }}">{{ i[3] }}</span>
        </td>

        <td>
            <span class="badge status-{{ i[4] }}">{{ i[4] }}</span>
        </td>

        <td>{{ i[5] }}</td>
        <td>{{ i[6] }}</td>
        <td>{{ i[7] }}</td>
        <td>{{ i[8] }}</td>
    </tr>
    {% endfor %}
</table>

<script>
// Sur la page Interventions, une intervention clôturée ne doit jamais proposer
// de créer un deuxième rapport. Le serveur applique aussi la même protection.
window.openIntervention = function(id) {
    if (typeof isOperator !== "undefined" && isOperator) return;

    fetch("/interventions/" + id + "/details", { cache: "no-store" })
        .then(response => response.json())
        .then(data => {
            document.getElementById("drawerTitle").innerText = data.title;

            const durationText = Number(data.estimated_duration || 0) > 0
                ? `${data.estimated_duration} min`
                : "Ouverte jusqu’au rapport";
            const technicianCode = data.technicien_code || "-";
            const status = String(data.status || "").toLowerCase();
            const reportAlreadySubmitted = status === "completed";

            let actions = "";
            if (typeof canWriteReport !== "undefined" && canWriteReport) {
                if (reportAlreadySubmitted) {
                    actions = `
                        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;">
                            <a class="stock-btn-light" href="/stock/intervention/${data.id}">📦 Gérer les pièces</a>
                            <span class="badge status-completed">✓ Rapport déjà soumis</span>
                            <a class="btn-secondary" href="/rapports" style="text-decoration:none;">Voir les rapports</a>
                        </div>`;
                } else {
                    actions = `
                        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
                            <a class="stock-btn-light" href="/stock/intervention/${data.id}">📦 Gérer les pièces</a>
                            <button class="btn-success"
                                onclick="openReportForm(${data.id}, '${data.scheduled_time || ''}')">
                                Rédiger le rapport
                            </button>
                        </div>`;
                }
            }

            document.getElementById("drawerBody").innerHTML = `
                <p><strong>Date :</strong> ${data.scheduled_date} ${data.scheduled_time || ""}</p>
                <p><strong>Durée :</strong> ${durationText}</p>
                <p><strong>Technicien :</strong> ${technicianCode}</p>
                <p><strong>Équipement :</strong> ${data.equipement_nom}</p>
                <p><strong>Description :</strong> ${data.description || "-"}</p>
                ${actions}
            `;

            document.getElementById("drawer").classList.add("open");
        })
        .catch(error => {
            console.error("Erreur fetch :", error);
        });
};
</script>


<script>
// STOCK_REPORT_AUTO_OPEN
document.addEventListener("DOMContentLoaded", async () => {
    const id = Number(new URLSearchParams(window.location.search).get("report") || 0);
    if (!id) return;
    try {
        const r = await fetch(`/interventions/${id}/details`, {cache: "no-store"});
        const data = await r.json();
        document.getElementById("drawerTitle").innerText = "Rapport d'intervention";
        openReportForm(id, data.scheduled_time || "");
        document.getElementById("drawer").classList.add("open");
        history.replaceState({}, "", "/interventions");
    } catch (e) {
        console.error(e);
        alert("Les pièces sont validées, mais le formulaire du rapport n'a pas pu s'ouvrir.");
    }
});
</script>

{% endblock %}
